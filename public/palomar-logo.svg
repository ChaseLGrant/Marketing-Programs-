<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none">
  <!-- Outer star/comet shape - gray fill -->
  <polygon
    points="168,12  248,125  512,188  248,240  192,368  118,240  18,188  118,125"
    fill="#8c8c8c"
  />
  <!-- Red border stroke on star -->
  <polygon
    points="168,12  248,125  512,188  248,240  192,368  118,240  18,188  118,125"
    fill="none"
    stroke="#C8102E"
    stroke-width="9"
    stroke-linejoin="round"
  />
  <!-- Inner darker accent lines to give depth (the gray inner triangle visible in logo) -->
  <polygon
    points="168,12  222,148  118,125"
    fill="#6a6a6a"
    opacity="0.6"
  />
  <polygon
    points="192,368  222,228  118,240"
    fill="#6a6a6a"
    opacity="0.5"
  />
  <!-- Red P — bold, centered on star body -->
  <text
    x="118"
    y="282"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="210"
    fill="#C8102E"
    letter-spacing="-8"
  >P</text>
</svg>
